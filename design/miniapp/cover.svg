<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <!-- Stand-in Mini App cover. Text uses Avenir Next (bundled with macOS); cover.png is the exported final. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#40A8FA"/>
      <stop offset="1" stop-color="#2382E8"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <text x="320" y="183" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="84" letter-spacing="-1" fill="#FFFFFF">Tunegram</text>
  <text x="320" y="234" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="28" fill="#FFFFFF" fill-opacity="0.92">Listen to music together</text>
</svg>
